# Services de DÉVELOPPEMENT local (jamais une description de la production).
#
#   make up                     PostgreSQL seul
#   make up PROFILES="cache mail"        + Redis et une boîte mail de développement
#   make up PROFILES="mongo storage"     + MongoDB et un stockage compatible S3 (MinIO)
#
# Tous les ports sont liés à 127.0.0.1 et configurables par variable d'environnement (voir .env.example).
# Les mots de passe ci-dessous sont des valeurs de développement : ne jamais les réutiliser ailleurs.

name: app-dev

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pw}
      POSTGRES_DB: ${POSTGRES_DB:-app_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Contrôle par TCP (-h 127.0.0.1) : à la première création du volume, un serveur TEMPORAIRE (socket
      # Unix seulement) exécute init.sql puis redémarre ; sans -h, la sonde le déclarerait « prêt » trop tôt.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    profiles: ["cache"]
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    profiles: ["mongo"]
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-57017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Boîte mail de développement : capte tous les e-mails envoyés en SMTP (interface web sur MAIL_UI_PORT).
  mail:
    profiles: ["mail"]
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SMTP_DEV_PORT:-51025}:1025"
      - "127.0.0.1:${MAIL_UI_PORT:-58025}:8025"

  # Stockage compatible S3 pour développer sans compte cloud (STORAGE_BACKEND=s3, S3_ENDPOINT_URL=http://127.0.0.1:59000).
  storage:
    profiles: ["storage"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  mongo-data:
  minio-data:
