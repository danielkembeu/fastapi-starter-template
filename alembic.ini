# Configuration Alembic. L'URL de la base n'est JAMAIS écrite ici : alembic/env.py la lit dans
# app.core.config (DATABASE_URL), comme le reste de l'application.

[alembic]
script_location = %(here)s/alembic

# Nom des fichiers : horodatage en tête, pour que l'ordre de lecture du dossier suive l'ordre des migrations.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .
path_separator = os
output_encoding = utf-8
sqlalchemy.url =


[post_write_hooks]
# Chaque migration générée est corrigée puis formatée par ruff (mêmes règles que le reste du code) :
# aucun diff de style ne pollue les revues, et le hook de commit ne bloque pas sur un fichier généré.
hooks = ruff_fix, ruff_format

ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --unsafe-fixes --exit-zero REVISION_SCRIPT_FILENAME

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
